name: tts

on:
  workflow_dispatch:

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python generate.py
      - name: Commit MP3s back to the repo
        run: |
          mkdir -p mp3
          cp out/*.mp3 mp3/
          git config user.name "tts-bot"
          git config user.email "tts-bot@local"
          git add mp3/
          git commit -m "winter vo mp3s" || echo "nothing to commit"
          git push
